name: Deploy Store & Dashboard to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_ENV: production
          VITE_MODULE_DASHBOARD_ENABLED: "true"
          VITE_MODULE_CRM_ENABLED: ${{ vars.VITE_MODULE_CRM_ENABLED }}
          VITE_MODULE_ORDERS_ENABLED: ${{ vars.VITE_MODULE_ORDERS_ENABLED }}
          VITE_MODULE_PRODUCTS_ENABLED: ${{ vars.VITE_MODULE_PRODUCTS_ENABLED }}
          VITE_MODULE_REPORTS_ENABLED: ${{ vars.VITE_MODULE_REPORTS_ENABLED }}
          VITE_MODULE_COMMERCIAL_ENABLED: ${{ vars.VITE_MODULE_COMMERCIAL_ENABLED }}
          VITE_COMMERCIAL_CLIENTS_ENABLED: ${{ vars.VITE_COMMERCIAL_CLIENTS_ENABLED }}
          VITE_COMMERCIAL_COMMANDES_ENABLED: ${{ vars.VITE_COMMERCIAL_COMMANDES_ENABLED }}
          VITE_COMMERCIAL_CATALOGUE_ENABLED: ${{ vars.VITE_COMMERCIAL_CATALOGUE_ENABLED }}
          VITE_COMMERCIAL_ACCREDITIF_ENABLED: ${{ vars.VITE_COMMERCIAL_ACCREDITIF_ENABLED }}
          VITE_COMMERCIAL_SIMULATION_ENABLED: ${{ vars.VITE_COMMERCIAL_SIMULATION_ENABLED }}
          VITE_COMMERCIAL_SAV_ENABLED: ${{ vars.VITE_COMMERCIAL_SAV_ENABLED }}
          VITE_COMMERCIAL_RAPPORTS_ENABLED: ${{ vars.VITE_COMMERCIAL_RAPPORTS_ENABLED }}
          VITE_MAINTENANCE_MODE: "false"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
